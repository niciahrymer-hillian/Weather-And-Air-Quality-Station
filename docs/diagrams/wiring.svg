<svg viewBox="0 0 920 620" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,Consolas,monospace">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff10" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="920" height="620" fill="#0d0d12"/>
  <rect width="920" height="620" fill="url(#grid)"/>

  <text x="24" y="34" fill="#e6e6e6" font-size="20" font-weight="600">Weather &amp; Air Quality Station — Wiring</text>
  <text x="24" y="54" fill="#94a3b8" font-size="12">Core build (USB/battery) + optional solar variant, dashed</text>

  <!-- ===== SOLAR VARIANT (dashed group, left column) ===== -->
  <g stroke="#eab308" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <rect x="24" y="90" width="220" height="480" rx="10"/>
  </g>
  <text x="34" y="110" fill="#eab308" font-size="12" font-weight="600">SOLAR VARIANT (optional)</text>

  <!-- Solar panel -->
  <rect x="48" y="130" width="170" height="90" rx="6" fill="#14141c" stroke="#eab308" stroke-width="1.5"/>
  <text x="133" y="158" fill="#e6e6e6" font-size="13" text-anchor="middle" font-weight="600">Solar Panel</text>
  <text x="133" y="176" fill="#94a3b8" font-size="10" text-anchor="middle">5W, sized to cloudiest week</text>
  <text x="60" y="212" fill="#eab308" font-size="10">+</text>
  <text x="200" y="212" fill="#64748B" font-size="10">−</text>

  <!-- wires panel -> controller -->
  <line x1="65" y1="220" x2="65" y2="260" stroke="#eab308" stroke-width="2"/>
  <line x1="200" y1="220" x2="200" y2="260" stroke="#64748B" stroke-width="2"/>

  <!-- Charge controller -->
  <rect x="48" y="260" width="170" height="110" rx="6" fill="#14141c" stroke="#eab308" stroke-width="1.5"/>
  <text x="133" y="284" fill="#e6e6e6" font-size="13" text-anchor="middle" font-weight="600">Charge Controller</text>
  <text x="133" y="300" fill="#94a3b8" font-size="10" text-anchor="middle">low-voltage cutoff</text>
  <text x="60" y="320" fill="#94a3b8" font-size="9">SOLAR IN</text>
  <text x="60" y="345" fill="#94a3b8" font-size="9">BAT</text>
  <text x="160" y="345" fill="#94a3b8" font-size="9">OUT 5V</text>

  <!-- controller -> battery -->
  <line x1="65" y1="370" x2="65" y2="410" stroke="#f97316" stroke-width="2"/>
  <line x1="200" y1="370" x2="200" y2="410" stroke="#64748B" stroke-width="2"/>

  <!-- LiPo battery -->
  <rect x="48" y="410" width="170" height="70" rx="6" fill="#14141c" stroke="#eab308" stroke-width="1.5"/>
  <text x="133" y="440" fill="#e6e6e6" font-size="13" text-anchor="middle" font-weight="600">LiPo Battery</text>
  <text x="133" y="458" fill="#94a3b8" font-size="10" text-anchor="middle">JST-PH, protection circuit</text>

  <!-- battery -> ESP32 (leaves the dashed box toward core) -->
  <line x1="218" y1="445" x2="290" y2="445" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="222" y="438" fill="#f97316" font-size="9">VBAT →</text>

  <!-- ===== CORE BUILD (center) ===== -->
  <rect x="300" y="230" width="220" height="260" rx="8" fill="#14141c" stroke="#38bdf8" stroke-width="2"/>
  <text x="410" y="256" fill="#e6e6e6" font-size="14" text-anchor="middle" font-weight="600">ESP32 Dev Board</text>
  <text x="410" y="272" fill="#94a3b8" font-size="10" text-anchor="middle">wifi built in, or swap for a LoRa32</text>

  <!-- ESP32 pin labels -->
  <g font-size="10" fill="#94a3b8">
    <text x="312" y="300">3V3</text>
    <text x="312" y="320">GND</text>
    <text x="312" y="340">GPIO21 (SDA)</text>
    <text x="312" y="360">GPIO22 (SCL)</text>
    <text x="312" y="380">GPIO4 (rain)</text>
    <text x="312" y="400">GPIO16 (PM UART RX)</text>
    <text x="440" y="300" text-anchor="end">VIN/USB-C 5V</text>
  </g>

  <!-- pin dots -->
  <circle cx="300" cy="296" r="3" fill="#f97316"/>
  <circle cx="300" cy="316" r="3" fill="#64748B"/>
  <circle cx="300" cy="336" r="3" fill="#38bdf8"/>
  <circle cx="300" cy="356" r="3" fill="#38bdf8"/>
  <circle cx="300" cy="376" r="3" fill="#a78bfa"/>
  <circle cx="300" cy="396" r="3" fill="#4ade80"/>
  <circle cx="520" cy="296" r="3" fill="#f97316"/>

  <!-- ===== BME280 (right) ===== -->
  <rect x="620" y="150" width="180" height="110" rx="6" fill="#14141c" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="710" y="174" fill="#e6e6e6" font-size="13" text-anchor="middle" font-weight="600">BME280</text>
  <text x="710" y="190" fill="#94a3b8" font-size="10" text-anchor="middle">temp / humidity / pressure</text>
  <g font-size="10" fill="#94a3b8">
    <text x="632" y="215">VIN</text>
    <text x="632" y="232">GND</text>
    <text x="632" y="249">SCL</text>
    <text x="750" y="249">SDA</text>
  </g>
  <circle cx="622" cy="211" r="3" fill="#f97316"/>
  <circle cx="622" cy="228" r="3" fill="#64748B"/>
  <circle cx="622" cy="245" r="3" fill="#38bdf8"/>
  <circle cx="798" cy="245" r="3" fill="#38bdf8"/>

  <!-- ESP32 -> BME280 wires (I2C shared bus) -->
  <polyline points="520,296 622,296 622,211" fill="none" stroke="#f97316" stroke-width="2"/>
  <polyline points="520,316 600,316 600,228 622,228" fill="none" stroke="#64748B" stroke-width="2"/>
  <polyline points="520,336 610,336 610,245 622,245" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- ===== Optional PM/CO2 sensor (dashed, lower right) ===== -->
  <rect x="620" y="300" width="180" height="90" rx="6" fill="#14141c" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="710" y="324" fill="#e6e6e6" font-size="12" text-anchor="middle" font-weight="600">PMS5003 / SCD40</text>
  <text x="710" y="340" fill="#94a3b8" font-size="9" text-anchor="middle">optional — particulate or CO2</text>
  <text x="632" y="360" fill="#94a3b8" font-size="9">UART / I2C</text>
  <polyline points="520,396 600,396 600,360 620,360" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- ===== Rain gauge (bottom) ===== -->
  <rect x="330" y="530" width="160" height="70" rx="6" fill="#14141c" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="410" y="556" fill="#e6e6e6" font-size="12" text-anchor="middle" font-weight="600">Rain Gauge</text>
  <text x="410" y="572" fill="#94a3b8" font-size="9" text-anchor="middle">tipping-bucket reed switch</text>
  <text x="410" y="588" fill="#94a3b8" font-size="9" text-anchor="middle">+ 10k pull-up to 3V3</text>
  <polyline points="300,376 315,376 315,540 330,540" fill="none" stroke="#a78bfa" stroke-width="2"/>

  <!-- Legend -->
  <g font-size="10" fill="#94a3b8">
    <text x="620" y="470" fill="#e6e6e6" font-weight="600">Legend</text>
    <line x1="620" y1="482" x2="644" y2="482" stroke="#f97316" stroke-width="2"/><text x="650" y="486">Power / VIN</text>
    <line x1="620" y1="498" x2="644" y2="498" stroke="#64748B" stroke-width="2"/><text x="650" y="502">Ground</text>
    <line x1="620" y1="514" x2="644" y2="514" stroke="#38bdf8" stroke-width="2"/><text x="650" y="518">I2C data/clock</text>
    <line x1="620" y1="530" x2="644" y2="530" stroke="#a78bfa" stroke-width="2"/><text x="650" y="534">Digital I/O</text>
    <line x1="620" y1="546" x2="644" y2="546" stroke="#eab308" stroke-width="2" stroke-dasharray="4 3"/><text x="650" y="550">Solar variant only</text>
  </g>
</svg>
