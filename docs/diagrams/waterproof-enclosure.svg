<svg viewBox="0 0 920 520" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,Consolas,monospace">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="920" height="520" fill="#0d0d12"/>
  <rect width="920" height="520" fill="url(#grid2)"/>

  <text x="24" y="34" fill="#e6e6e6" font-size="20" font-weight="600">Weather Station — Waterproof Enclosure (cross-section)</text>
  <text x="24" y="54" fill="#94a3b8" font-size="12">IP67 box, sealed cable entry, vented sensor path — same pattern as Walkie-Talkie-Build &amp; Security-Doorbell-Cam</text>

  <!-- Enclosure outline -->
  <rect x="140" y="90" width="500" height="340" rx="14" fill="#14141c" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="390" y="118" fill="#38bdf8" font-size="13" text-anchor="middle" font-weight="600">IP67 project box</text>

  <!-- ESP32 + BME280 inside -->
  <rect x="180" y="150" width="150" height="80" rx="6" fill="#0d0d12" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="255" y="185" fill="#e6e6e6" font-size="11" text-anchor="middle">ESP32 +</text>
  <text x="255" y="200" fill="#e6e6e6" font-size="11" text-anchor="middle">charge controller</text>

  <rect x="180" y="260" width="150" height="60" rx="6" fill="#0d0d12" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="255" y="285" fill="#e6e6e6" font-size="11" text-anchor="middle">LiPo battery</text>
  <text x="255" y="300" fill="#94a3b8" font-size="9" text-anchor="middle">mounted away from vent</text>

  <!-- Desiccant -->
  <rect x="180" y="340" width="150" height="50" rx="6" fill="#0d0d12" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="255" y="368" fill="#eab308" font-size="10" text-anchor="middle">silica gel packet</text>
  <text x="255" y="382" fill="#94a3b8" font-size="9" text-anchor="middle">catches condensation</text>

  <!-- Vented membrane for BME280 -->
  <rect x="370" y="150" width="230" height="110" rx="6" fill="#0d0d12" stroke="#4ade80" stroke-width="1.5"/>
  <text x="485" y="172" fill="#e6e6e6" font-size="11" text-anchor="middle">BME280 sits behind a</text>
  <text x="485" y="188" fill="#4ade80" font-size="11" text-anchor="middle" font-weight="600">Gore-type vent membrane</text>
  <text x="485" y="206" fill="#94a3b8" font-size="9" text-anchor="middle">air/pressure passes through,</text>
  <text x="485" y="220" fill="#94a3b8" font-size="9" text-anchor="middle">liquid water is blocked —</text>
  <text x="485" y="234" fill="#94a3b8" font-size="9" text-anchor="middle">a fully sealed box reads pressure wrong</text>

  <!-- Cable glands on bottom edge -->
  <g stroke="#f97316" stroke-width="2" fill="none">
    <rect x="220" y="420" width="26" height="26" rx="4"/>
    <rect x="280" y="420" width="26" height="26" rx="4"/>
    <rect x="480" y="420" width="26" height="26" rx="4"/>
  </g>
  <text x="233" y="470" fill="#94a3b8" font-size="9" text-anchor="middle">solar</text>
  <text x="293" y="470" fill="#94a3b8" font-size="9" text-anchor="middle">rain gauge</text>
  <text x="493" y="470" fill="#94a3b8" font-size="9" text-anchor="middle">antenna (if ext.)</text>
  <text x="390" y="450" fill="#f97316" font-size="10" text-anchor="middle" font-weight="600">PG7 waterproof cable glands</text>

  <!-- gland lines through enclosure wall -->
  <line x1="233" y1="420" x2="233" y2="390" stroke="#f97316" stroke-width="2"/>
  <line x1="293" y1="420" x2="293" y2="390" stroke="#f97316" stroke-width="2"/>
  <line x1="493" y1="420" x2="493" y2="420" stroke="#f97316" stroke-width="2"/>

  <!-- Solar panel outside, mounted above -->
  <rect x="680" y="120" width="180" height="90" rx="6" fill="#14141c" stroke="#eab308" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="770" y="150" fill="#e6e6e6" font-size="12" text-anchor="middle" font-weight="600">Solar panel</text>
  <text x="770" y="166" fill="#94a3b8" font-size="9" text-anchor="middle">mounted outside enclosure,</text>
  <text x="770" y="180" fill="#94a3b8" font-size="9" text-anchor="middle">angled/oriented for sun exposure</text>
  <line x1="680" y1="165" x2="640" y2="165" stroke="#eab308" stroke-width="2"/>
  <line x1="640" y1="165" x2="640" y2="420" stroke="#eab308" stroke-width="2"/>
  <line x1="640" y1="420" x2="506" y2="420" stroke="#eab308" stroke-width="2"/>

  <!-- Callouts -->
  <g font-size="10" fill="#94a3b8">
    <text x="680" y="250" fill="#e6e6e6" font-weight="600">Key waterproofing rules</text>
    <text x="680" y="270">• Every wire crosses the wall through</text>
    <text x="690" y="284">a sealed gland — none loose/drilled</text>
    <text x="680" y="304">• Sensor needing airflow (BME280)</text>
    <text x="690" y="318">gets a vent membrane, not a hole</text>
    <text x="680" y="338">• Mount box so the lid/seam faces</text>
    <text x="690" y="352">down or sideways, never up</text>
    <text x="680" y="372">• Silica gel inside catches whatever</text>
    <text x="690" y="386">condensation still gets in</text>
  </g>
</svg>
